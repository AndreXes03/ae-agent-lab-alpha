name: Tried KYNEM? Tell us how it went
description: Share what worked, where you got stuck, or what would make KYNEM more useful.
labels: [tester-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying KYNEM. A few sentences are enough. Issues are public: please redact client names, private paths, and credentials. You do not need to upload a project or footage.
  - type: input
    id: workflow
    attributes:
      label: What did you try?
      placeholder: "e.g. Installed KYNEM, then asked it to retime a title on a copied project"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Worked as expected
        - Partly worked
        - Failed
        - Could not complete
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: macOS and After Effects versions help us reproduce issues.
      placeholder: "e.g. macOS 15, After Effects 2026, Codex desktop"
  - type: textarea
    id: prompt
    attributes:
      label: Prompt, if useful
      description: Share the wording or operation names only if they help explain the result. Remove sensitive details.
  - type: textarea
    id: outcome
    attributes:
      label: What happened, and what would you improve?
      description: Tell us what you expected and what you saw. A suggestion or rough edge is welcome too.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error or screenshot, if useful
      description: Include only redacted details safe to share publicly.
