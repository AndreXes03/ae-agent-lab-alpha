name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Offline alpha checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Offline policy, schema, and instance tests
        # These tests use mocks, temporary files and a loopback review server. They
        # do not start After Effects and do not establish native acceptance.
        run: npx vitest run --exclude 'tests/e2e/**'
