<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYNEM Storyboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c15;color:#e9efff;font:14px system-ui}button,textarea{font:inherit;color:inherit}button{cursor:pointer;background:#202c40;border:1px solid #35435a;border-radius:8px;padding:8px 12px}button:focus-visible,textarea:focus-visible{outline:2px solid #8fbaff}header{padding:18px;display:flex;gap:10px;align-items:center}h1{font-size:20px;margin:0;flex:1}.layout{display:grid;grid-template-columns:180px minmax(0,1fr) 260px;gap:16px;padding:0 18px 18px;height:calc(100vh - 78px)}nav,aside{overflow:auto}nav button{width:100%;text-align:left}nav img{width:100%;display:block;margin-bottom:7px}.thumb{margin-bottom:8px}.selected{border-color:#8fbaff}.connector{font-size:12px;color:#9abaff;margin-bottom:8px}.center{min-width:0;display:flex;flex-direction:column;gap:12px}.stage{position:relative;min-height:0;flex:1;display:grid;place-items:center;background:#020408;border:1px solid #253047;border-radius:12px;overflow:hidden}.stage img{max-width:100%;max-height:100%;object-fit:contain}.pin{position:absolute;border-radius:50%;background:#4275ea;border:2px solid white;width:24px;height:24px;display:grid;place-items:center;transform:translate(-50%,-50%);pointer-events:none}.muted{font-size:12px;color:#a6b6d1}.transport{display:flex;gap:8px;align-items:center}.transport span{flex:1}#details{max-height:160px;overflow:auto;white-space:pre-wrap;line-height:1.5}aside{border:1px solid #29354a;border-radius:12px;padding:12px}aside p{white-space:pre-wrap;overflow-wrap:anywhere}.composer{position:fixed;z-index:10;width:300px;max-width:calc(100vw - 24px);padding:12px;background:#172237;border:1px solid #5875a0;border-radius:13px;box-shadow:0 14px 45px #0009}.composer[hidden]{display:none}textarea{width:100%;height:90px;background:#080f1d;border:1px solid #34405a;border-radius:8px;padding:8px}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}.exports{display:grid;gap:8px}#status{font-size:12px;color:#a8c2fc}.comments-hidden{grid-template-columns:180px minmax(0,1fr)}.comments-hidden aside{display:none}@media(max-width:760px){.layout{grid-template-columns:110px minmax(0,1fr);height:80vh;padding:10px}.layout aside{grid-column:1/-1}.comments-hidden{grid-template-columns:110px minmax(0,1fr)}header{flex-wrap:wrap}.stage{min-height:240px}}


header{padding:20px 26px 16px}.layout{padding:0 26px 24px;grid-template-columns:155px minmax(0,1fr) 260px;gap:22px;height:calc(100vh - 100px)}nav .thumb{background:transparent;border:1px solid transparent;padding:8px;border-radius:12px;font-size:11px;color:#6b7e9a;margin:0}nav .thumb img{border-radius:7px;box-shadow:0 3px 9px #31517612;margin-bottom:8px}nav .selected{border-color:#b5cdf0}.connector{background:transparent;border:0;box-shadow:none;width:100%;text-align:center;font-size:10px;margin:0;padding:4px;color:#90a7c9}.connector:hover{background:#edf3ff}.transport{color:#6d819f;font-size:12px}.transport button{padding:7px 11px}#details{font-size:11px;line-height:1.6;color:#8595ac;background:transparent;max-height:104px}#source{color:#a0acc0;font-size:10px}.comments-hidden{grid-template-columns:155px minmax(0,1fr)}#notes button{background:#edf3fc;border-color:transparent;color:#6481ae;font-size:11px}#notes p{font-size:12px}.exports input{max-width:190px;font-size:11px}.exports label{font-size:11px;color:#8898af}@media(max-width:760px){header{padding:15px}.layout{padding:0 12px 16px;grid-template-columns:105px minmax(0,1fr);gap:12px;height:auto;min-height:80vh}.comments-hidden{grid-template-columns:105px minmax(0,1fr)}.workflow{width:100%}.agent-bar{flex-wrap:wrap}}
.import-feedback{display:block;cursor:pointer;border:1px solid #dce4ef;border-radius:11px;background:#ffffffb8;color:#7f91ae;padding:9px 13px;text-align:center}.import-feedback:hover{background:#fff;border-color:#b8cceb}.import-feedback input{display:none}.import-feedback:focus-within{outline:2px solid #688fea;outline-offset:3px}
/* Compact local review workspace. */
:root{color-scheme:light;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29333f;background:#f5f6f7}
body{background:radial-gradient(ellipse at 100% 0,#d9e7f730,transparent 38%),#f5f6f7;color:#29333f}
button{background:transparent;border:1px solid transparent;border-radius:3px;padding:6px 8px;color:#465464;box-shadow:none;transition:none;font-size:12px}button:hover{background:#e9edf1;border-color:transparent}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #779ac5;outline-offset:2px}
.primary{background:transparent;border-color:transparent;color:#465464;box-shadow:none}.primary:hover{background:#e9edf1}.active,.selected{background:transparent!important;border-color:#668fbe!important;color:#244f83}
main{padding:14px 18px;gap:12px;max-width:none}header{padding:0 0 9px;gap:16px;flex-wrap:nowrap;min-height:34px;border-bottom:1px solid #dfe3e7}header h1,h1{font-size:13px;font-weight:600;letter-spacing:0;margin:0;color:#29333f}h1 span{font-size:12px;letter-spacing:0;color:#6f7c8a;font-weight:400;margin-left:12px}header p{font-size:10px;margin:3px 0 0;color:#7d8792}.wordmark{font-size:13px;font-weight:650;letter-spacing:.15px;color:#29333f}header #title{font-size:12px;flex:1;color:#687585}.workflow{display:none}.muted,.file{color:#74808d;font-size:11px}.file{white-space:nowrap}
.layout{gap:18px}.stage{border:1px solid #dfe4e9;border-radius:2px;background:#e9edf2;box-shadow:none}.sidebar,aside{border:0;border-left:1px solid #dfe3e7;border-radius:0;background:transparent;box-shadow:none;padding:0 0 0 17px}.sidebar h2,aside h2{font-size:12px!important;font-weight:500;color:#576675;margin:0 0 12px}.list{padding-right:2px}.item{border-color:#e0e5e9;padding:10px 0}.item p,aside p{color:#3f4e5e;line-height:1.5;font-size:12px}.item-top button,#notes button{background:transparent;border:0;padding:3px 0;color:#60768e;font-size:10px;box-shadow:none}.item small{color:#7a8794}.exports{gap:2px;padding-top:9px;border-top:1px solid #e0e5e9;margin-top:12px}.exports button{font-size:11px;padding:6px 3px;text-align:left}.exports .primary{background:transparent;color:#465464}.status,#status{font-size:10px;color:#62778e;line-height:1.4}
.composer{border:1px solid #c8d1db;border-radius:4px;background:#fff;box-shadow:0 4px 16px #24364a18;color:#384c62;padding:10px}.composer-heading,#target{color:#65778c;font-size:11px;margin-bottom:8px}.composer textarea,textarea{background:#fff;border:1px solid #d7dee6;border-radius:3px;color:#293c51;font-size:12px;padding:8px}.composer-actions{gap:5px;margin-top:6px}.composer-actions button[type=submit],.actions button[type=submit]{background:#eef2f7;color:#3d5d82;border-color:transparent}
.transport{gap:8px;color:#657485;font-size:11px}.transport button{padding:4px 7px}.clock{font-size:10px;color:#657485}.timeline{height:30px}.rail{background:#d2dbe5;height:3px;top:15px}.selection{background:#96b2d173;top:12px;height:9px}.handle{background:#7798be;width:7px;height:22px;top:6px;border-radius:2px}.playhead{background:#4d6f98;box-shadow:none}.timeline-caption{font-size:10px;color:#7d8895}.previews{gap:12px;margin-top:7px}.preview{gap:6px;color:#718090;font-size:10px}.preview video{width:72px;height:40px;border-radius:0;background:#e7ecf2;border:1px solid #dce2e9}.preview span{min-width:48px}.pin{background:#537eaf;color:white;box-shadow:none}
.agent-bar{border:0;border-top:1px solid #e0e5e9;border-radius:0;background:transparent;padding:10px 0 0;gap:10px;justify-content:space-between}.agent-state{color:#6a798b;font-size:10px}.agent-state::before{width:4px;height:4px;background:#b1bdc9;margin-right:6px}#sendAgent{background:#517dab;border:1px solid #517dab;color:#fff;border-radius:5px;box-shadow:none;font-size:11px;padding:7px 10px;white-space:nowrap}#sendAgent:hover{background:#466f9b}.local-hint{font-size:10px;color:#8894a0;margin:4px 0 0;line-height:1.4}#latestPreviewLink{font-size:10px;color:#577796}
.import-feedback{background:transparent;border:0;border-radius:0;box-shadow:none;padding:6px 3px;text-align:left;color:#6c7c8d;font-size:11px}.import-feedback:hover{background:#e9edf1;border:0}.import-feedback input{display:none}

header{padding:14px 0 9px;margin:0 18px}.layout{padding:12px 18px 16px;grid-template-columns:136px minmax(0,1fr) 250px;gap:18px;height:calc(100vh - 60px)}nav .thumb{padding:0 0 8px;margin:0 0 3px;border:1px solid transparent;border-radius:0;background:transparent;color:#6f7c8a;font-size:10px}nav .thumb img{border-radius:0;box-shadow:none;margin-bottom:6px}nav .selected{border-color:transparent!important}nav .selected img{outline:1px solid #658ab5;outline-offset:2px}.connector{background:transparent;border:0;border-radius:0;box-shadow:none;padding:2px 0 8px;font-size:9px;color:#8b9aab}.connector:hover{background:transparent;color:#5278a4}.center{gap:9px}.comments-hidden{grid-template-columns:136px minmax(0,1fr)}#details{max-height:90px;font-size:10px;color:#738193;line-height:1.5}#source{font-size:9px;color:#8995a3}.transport #frameTitle{color:#566779}.exports label{font-size:11px}@media(max-width:760px){header{padding:10px 0 8px;margin:0 12px}.layout{padding:10px 12px 15px;grid-template-columns:96px minmax(0,1fr);height:auto;min-height:80vh}.comments-hidden{grid-template-columns:96px minmax(0,1fr)}}</style><header><span class="wordmark">KYNEM</span><span id="title">Storyboard</span><button id="toggle">Commenti</button><button id="approve">Approva</button></header><div class="layout" id="layout"><nav id="scenes" aria-label="Scene principali"></nav><section class="center"><div class="transport"><button id="previous">←</button><span id="frameTitle"></span><button id="next">→</button><button id="back" hidden>Torna alle scene</button></div><div class="stage" id="stage"><img id="artwork" alt="Styleframe"><div id="pins"></div></div><div class="muted" id="source"></div><div class="agent-bar"><span class="agent-state" id="agentState" role="status">Revisione locale · preview disponibile</span><a id="latestPreviewLink" class="muted" hidden target="_blank" rel="noopener">Ultima preview ↗</a><button id="sendAgent" type="button">Invia all’agente</button></div><p class="local-hint" id="agentHint">Le scene principali restano navigabili durante la lavorazione.</p><div id="details"></div></section><aside><h2 style="font-size:15px">Feedback</h2><div id="notes"></div><div class="exports"><button id="json">Esporta JSON</button><button id="text">Esporta testo</button><label class="import-feedback">Importa feedback JSON<input type="file" id="import" accept=".json,application/json"></label></div><p id="status" role="status"></p></aside></div><form id="composer" class="composer" hidden><p id="target"></p><textarea id="note" required aria-label="Commento"></textarea><div class="actions"><button id="cancel" type="button">Annulla</button><button type="submit">Salva commento</button></div></form><script type="application/json" id="context">__STORYBOARD_CONTEXT__</script><script>
'use strict';const $=id=>document.getElementById(id),context=JSON.parse($('context').textContent);let sceneIndex=0,transition=null,point=null,notes=[],approval=null;const key='kynem-storyboard:'+context.manifestHash;
try{notes=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(notes))notes=[];
$('title').textContent=context.spec.title+' · '+context.spec.revision;
function active(){return transition?(transition.preview||context.frames[sceneIndex]):context.frames[sceneIndex]}
function target(){return {id:transition?transition.id:active().id,kind:transition?'motion':'styling'}}
function status(s){$('status').textContent=s}
function close(){$('composer').hidden=true;point=null;drawPins()}
function imageRect(){const i=$('artwork'),r=i.getBoundingClientRect();return r}
function drawPins(){const layer=$('pins');layer.replaceChildren();const r=imageRect(),s=$('stage').getBoundingClientRect(),t=target();for(const [n,i]of notes.entries()){if(i.target.id!==t.id||i.target.kind!==t.kind)continue;const p=document.createElement('span');p.className='pin';p.textContent=n+1;p.style.left=(r.left-s.left+i.position.x*r.width)+'px';p.style.top=(r.top-s.top+i.position.y*r.height)+'px';layer.append(p)}}
function renderNotes(){$('notes').replaceChildren();notes.forEach((n,index)=>{const row=document.createElement('p'),button=document.createElement('button');button.textContent='#'+(index+1)+' · '+n.target.id+' · '+n.target.kind;button.onclick=()=>{if(n.target.kind==='motion'){transition=context.transitions.find(t=>t.id===n.target.id);sceneIndex=context.frames.findIndex(f=>f.id===transition.fromScene)}else{transition=null;sceneIndex=context.frames.findIndex(f=>f.id===n.target.id)}show()};const text=document.createElement('p');text.textContent=n.note;row.append(button,text);$('notes').append(row)});drawPins()}
function show(){close();const frame=active();$('artwork').src=frame.file;$('frameTitle').textContent=transition?'Raccordo · '+transition.fromScene+' → '+transition.toScene:frame.title;$('back').hidden=!transition;$('previous').disabled=sceneIndex===0;$('next').disabled=sceneIndex===context.frames.length-1;$('source').textContent=frame.source==='schematic'?'Styleframe schematico SVG · layout riproducibile · effetti AE da verificare':'Immagine fornita · ricostruzione AE da verificare';if(transition){$('details').textContent='Elemento mantenuto: '+transition.elementIds.join(', ')+'\nRaccordo: '+JSON.stringify(transition.recipe)+'\nDurata: '+transition.durationFrames+' frame · stagger '+transition.staggerFrames+'\nCurve: '+JSON.stringify(transition.curve)+'\nProprietà AE: '+JSON.stringify(transition.properties)+'\nArrivo: '+transition.handoff+(transition.preview?'':'\nNessun frame intermedio: anteprima della scena di partenza')}else{const scene=context.spec.scenes[sceneIndex];$('details').textContent='Frame '+scene.startFrame+' · durata '+scene.durationFrames+' frame · '+context.spec.format.fps+' fps\n'+(scene.effectRecipes?'Ricette effetti: '+JSON.stringify(scene.effectRecipes):'')}for(const b of $('scenes').querySelectorAll('.thumb'))b.classList.toggle('selected',b.dataset.id===context.frames[sceneIndex].id);drawPins()}
context.frames.forEach((frame,index)=>{const b=document.createElement('button');b.className='thumb';b.dataset.id=frame.id;const img=document.createElement('img');img.src=frame.file;img.alt=frame.title;b.append(img,document.createTextNode(frame.title));b.onclick=()=>{sceneIndex=index;transition=null;show()};$('scenes').append(b);const next=context.frames[index+1];if(next)for(const t of context.transitions.filter(t=>t.fromScene===frame.id&&t.toScene===next.id)){const connector=document.createElement('button');connector.className='connector';connector.textContent='↳ Raccordo';connector.onclick=()=>{sceneIndex=index;transition=t;show()};$('scenes').append(connector)}});
$('previous').onclick=()=>{sceneIndex=Math.max(0,sceneIndex-1);transition=null;show()};$('next').onclick=()=>{sceneIndex=Math.min(context.frames.length-1,sceneIndex+1);transition=null;show()};$('back').onclick=()=>{transition=null;show()};$('toggle').onclick=()=>{$('layout').classList.toggle('comments-hidden');if(typeof requestAnimationFrame==='function')requestAnimationFrame(drawPins)};$('artwork').onload=drawPins;if(typeof ResizeObserver==='function')new ResizeObserver(drawPins).observe($('stage'));
$('artwork').onclick=e=>{const r=imageRect();point={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};if(point.x<0||point.x>1||point.y<0||point.y>1)return;const f=$('composer');f.hidden=false;f.style.left=Math.max(12,Math.min(e.clientX+14,window.innerWidth-f.offsetWidth-12))+'px';f.style.top=Math.max(12,Math.min(e.clientY+14,window.innerHeight-f.offsetHeight-12))+'px';$('target').textContent=(transition?'Movimento raccordo':'Stile scena')+' · '+target().id;$('note').focus()};$('cancel').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('composer').onsubmit=e=>{e.preventDefault();const note=$('note').value.trim();if(!point||!note)return;notes.push({id:Date.now().toString(36),target:target(),position:{...point},coordinateSpace:'normalized-frame-image-top-left',note});$('note').value='';try{localStorage.setItem(key,JSON.stringify(notes))}catch{status('Scarica il feedback prima di chiudere')}close();renderNotes()};
function payload(){return {schemaVersion:1,manifestHash:context.manifestHash,revision:context.spec.revision,sceneHashes:context.sceneHashes,feedback:notes,approval}}
function download(data,name,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('json').onclick=()=>download(JSON.stringify(payload(),null,2),'storyboard-feedback.json','application/json');$('text').onclick=()=>download('KYNEM Storyboard '+context.spec.id+' · '+context.spec.revision+'\nManifest SHA256: '+context.manifestHash+'\n\n'+notes.map((n,i)=>(i+1)+'. '+n.target.id+' · '+n.target.kind+' · x '+(n.position.x*100).toFixed(1)+'%, y '+(n.position.y*100).toFixed(1)+'%\n'+n.note).join('\n\n'),'storyboard-feedback.txt','text/plain');
$('approve').onclick=()=>{approval={status:'approved',manifestHash:context.manifestHash,revision:context.spec.revision,sceneHashes:context.sceneHashes,approvedScenes:Object.entries(context.sceneHashes).map(([id,hash])=>({id,hash})),approvedAt:new Date().toISOString()};download(JSON.stringify({...payload(),approval},null,2),'storyboard-approval.json','application/json');status('Approvazione esportata per questa revisione. Nessuna modifica AE eseguita.')};
$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f)return;const data=JSON.parse(await f.text());const finite=n=>typeof n==='number'&&Number.isFinite(n);if(data.schemaVersion!==1||data.manifestHash!==context.manifestHash||data.revision!==context.spec.revision||!Array.isArray(data.feedback)||data.feedback.length>10000||data.feedback.some(n=>!n||typeof n.note!=='string'||n.note.length>20000||!n.target||!['motion','styling'].includes(n.target.kind)||!(n.target.kind==='motion'?context.transitions:context.frames).some(f=>f.id===n.target.id)||!n.position||![n.position.x,n.position.y].every(x=>finite(x)&&x>=0&&x<=1)))throw Error('Contesto o commenti non validi');notes=data.feedback;localStorage.setItem(key,JSON.stringify(notes));renderNotes();status('Feedback importato')}catch(e){status('Importazione rifiutata: '+e.message)}};show();renderNotes();
function handoffPayload(){return payload()}

// A local review remains usable while the companion inbox tracks real agent status.
let reviewSession=null,reviewPoll=null;
function showAgentState(state){const labels={idle:'Sessione locale pronta',queued:'Feedback ricevuto · in attesa dell’agente',processing:'Agente al lavoro · preview disponibile',completed:'Lavorazione completata · preview disponibile',failed:'Lavorazione interrotta · preview disponibile'};const code=state?.state||'idle';$('agentState').dataset.state=code;$('agentState').textContent=labels[code]||'Stato locale non disponibile';if(state?.message)$('agentHint').textContent=state.message;if(code==='queued')$('agentHint').textContent='Chiedi all’agente di leggere la revisione nella sessione locale. Il feedback non avvia una chat automaticamente.';if(state?.latestPreview&&typeof location!=='undefined'){const file=state.latestPreview;if(typeof file==='string'&&!file.split('/').includes('..')&&!/[:\\]/.test(file)&&!file.startsWith('/')){const link=$('latestPreviewLink');link.href=new URL(file,location.href).href;link.hidden=false}}}
async function discoverReviewSession(){if(typeof fetch!=='function'||typeof location==='undefined'||!['http:','https:'].includes(location.protocol))return null;const response=await fetch('/api/session',{cache:'no-store'});if(!response.ok)throw Error('Sessione locale non disponibile');const session=await response.json();if(!session.sessionId||!session.token||!session.context)throw Error('Sessione locale non valida');reviewSession=session;showAgentState(session.status);return session}
async function refreshReviewStatus(){if(!reviewSession)return;try{const response=await fetch('/api/status',{cache:'no-store',headers:{'X-Kynem-Token':reviewSession.token}});if(response.ok)showAgentState(await response.json())}catch{$('agentHint').textContent='Connessione locale sospesa. La preview e i commenti restano disponibili.'}}
$('sendAgent').onclick=async()=>{const button=$('sendAgent');button.disabled=true;try{const session=reviewSession||await discoverReviewSession();if(!session){download(JSON.stringify(handoffPayload(),null,2),'KYNEM-agent-handoff.json','application/json');$('agentState').textContent='Pacchetto feedback esportato';$('agentHint').textContent='Apri il JSON con l’agente per continuare. Per inviare alla sessione locale, apri questa revisione dal server KYNEM.';return}const response=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json','X-Kynem-Token':session.token},body:JSON.stringify({sessionId:session.sessionId,context:session.context,feedback:handoffPayload()})});if(!response.ok)throw Error('Invio rifiutato dalla sessione locale');const receipt=await response.json();showAgentState(receipt.status||{state:'queued'});status('Feedback salvato nella sessione locale')}catch(e){status(e.message);$('agentHint').textContent='Il feedback resta disponibile: puoi esportare il JSON e passarlo all’agente.'}finally{button.disabled=false}};
if(typeof fetch==='function'&&typeof location!=='undefined'&&['http:','https:'].includes(location.protocol)){discoverReviewSession().then(session=>{if(session&&typeof setInterval==='function')reviewPoll=setInterval(refreshReviewStatus,5000)}).catch(()=>{$('agentHint').textContent='Revisione locale. Avvia la sessione KYNEM per inviare il feedback all’agente.'})}
</script></html>
